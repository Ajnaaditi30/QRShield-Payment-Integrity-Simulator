kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --project ../.. uvicorn backend.main:app --app-dir ../.. --host 0.0.0.0 --port \"$PORT\""

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--no-dev", "--no-install-project"]

[services.production.run]
args = ["uv", "run", "--frozen", "--no-sync", "uvicorn", "backend.main:app", "--app-dir", ".", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
